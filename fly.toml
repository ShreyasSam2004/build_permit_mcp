# Fly.io deployment. First time:
#   fly launch --no-deploy --copy-config --name <unique-app-name>
#   fly secrets set PERMITS_API_KEY=$(openssl rand -hex 24) SOCRATA_APP_TOKEN=<token>
#   fly secrets set PERMITS_ALLOWED_HOSTS=<unique-app-name>.fly.dev
#   fly deploy
# MCP endpoint: https://<unique-app-name>.fly.dev/mcp   Health: /healthz

app = "permits-mcp"
primary_region = "ord"  # Chicago: closest to the three portals on average

[env]
  PERMITS_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # one warm machine keeps the 10-minute query cache useful; 0 = scale to zero

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
